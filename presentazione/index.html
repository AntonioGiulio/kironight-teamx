<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a111b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23152923'/%3E%3Cpath d='m16 6 9 5v10l-9 5-9-5V11zM7 11l9 5 9-5m-9 5v10' fill='none' stroke='%2379f6d2' stroke-width='1.7'/%3E%3C/svg%3E">
  <meta name="description" content="La presentazione LiveArch di Kiro Night in 16 tappe, con scene animate in Three.js.">
  <title>LiveArch · Prima il contesto</title>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="brand"><span class="brand-icon" data-icon="core"></span><div><strong>LiveArch<span>.</span></strong><small>KIRO NIGHT · TEAM X</small></div></div>
      <div class="masthead-center"><i></i> ROTTA LIVEARCH</div>
      <button id="fullscreen" class="icon-button fullscreen" type="button" title="Schermo intero" aria-label="Schermo intero" data-icon="expand"></button>
    </header>

    <main id="experience" class="experience">
      <section id="brief" class="brief" aria-labelledby="chapter-title"></section>
      <section class="stage" aria-label="Viaggio nello spazio">
        <div class="visual" aria-hidden="true">
          <canvas id="world"></canvas>
          <svg class="schematic" viewBox="0 0 500 420" fill="none" hidden>
            <circle cx="250" cy="210" r="166" stroke="currentColor" opacity=".2" stroke-dasharray="4 8"/>
            <circle cx="250" cy="210" r="122" stroke="currentColor" opacity=".4"/>
            <circle cx="250" cy="210" r="98" stroke="currentColor" opacity=".2"/>
            <path d="M250 85v250M125 210h250" stroke="currentColor" opacity=".2"/>
            <path d="m250 152 52 30v56l-52 30-52-30v-56zM198 182l52 30 52-30m-52 30v56" stroke="currentColor" stroke-width="3"/>
            <path d="m158 118 12 12-12 12-12-12zM342 118l12 12-12 12-12-12zM158 278l12 12-12 12-12-12zM342 278l12 12-12 12-12-12z" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <div class="stage-header">
          <div><div class="telemetry"><i></i> ROTTA / LIVEARCH</div><h2 id="stage-title"></h2></div>
          <span id="stage-index" class="stage-index" aria-hidden="true"></span>
        </div>
        <div class="stage-register" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="stage-footer">
          <span id="stage-model"></span>
          <span class="waypoint"><i></i> VOLO LA–01</span>
        </div>
      </section>
    </main>

    <nav class="route" aria-label="Tappe della presentazione"><div class="route-steps" id="route"></div></nav>
    <footer class="footer">
      <span><strong id="route-total"></strong> &nbsp; SPECS / STEERING / SKILLS / HOOKS</span>
      <span class="keyboard-hint"><kbd>←</kbd> <kbd>→</kbd> tappe &nbsp;&nbsp; <kbd>Home</kbd> <kbd>End</kbd> estremi &nbsp;&nbsp; <kbd>F</kbd> schermo intero</span>
      <span>LIVEARCH / KIRO CONTEXT</span>
    </footer>
  </div>
  <p id="browser-status" role="status"></p>
  <dialog id="evidence" aria-labelledby="evidence-title"><div class="dialog-content" id="evidence-content"></div></dialog>
  <noscript>Attiva JavaScript per aprire la presentazione.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
